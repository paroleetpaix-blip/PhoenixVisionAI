<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Phoenix Vision AI</title>

    <link
        rel="stylesheet"
        href="/static/css/enterprise/launcher.css"
    >
    <link
        rel="icon"
        type="image/png"
        href="/static/images/favicon.png?v=1"
    >
</head>

<body>

<div class="launcher">

    <!-- ==========================================
         VÉRIFICATIONS SYSTÈME
         Petites informations en haut à gauche
    =========================================== -->

    <aside
        id="boot-status"
        class="boot-status"
    >

        <div class="boot-status-title">
            Vérification système
        </div>

        <div class="boot-item">
            <span class="boot-name">CPU</span>
            <span class="boot-check">✓</span>
        </div>

        <div class="boot-item">
            <span class="boot-name">Mémoire</span>
            <span class="boot-check">✓</span>
        </div>

        <div class="boot-item">
            <span class="boot-name">GPU / Accélération</span>
            <span class="boot-check">✓</span>
        </div>

        <div class="boot-item">
            <span class="boot-name">API OpenCV</span>
            <span class="boot-check">✓</span>
        </div>

        <div class="boot-item">
            <span class="boot-name">Caméras</span>
            <span class="boot-check">✓</span>
        </div>

        <div class="boot-item">
            <span class="boot-name">Base de données</span>
            <span class="boot-check">✓</span>
        </div>

        <div class="boot-item">
            <span class="boot-name">Réseau</span>
            <span class="boot-check">✓</span>
        </div>

        <div class="boot-item">
            <span class="boot-name">Droits & Permissions</span>
            <span class="boot-check">✓</span>
        </div>

        <div
            id="boot-message"
            class="boot-message"
        >
            Initialisation...
        </div>

    </aside>


    <!-- ==========================================
         CONTENU CENTRAL
    =========================================== -->

    <main class="launcher-center">

        <div class="phoenix-emblem">

            <div class="shield-crop">

                <img
                    src="/static/images/logoS.png"
                    alt="Phoenix"
                >

            </div>

            <div class="phoenix-name">
                PHOENIX
            </div>

            <div class="vision-name">

                <span class="gold-line"></span>

                <span>VISION AI</span>

                <span class="gold-line"></span>

            </div>

            <div class="version">
                Version 1.0 Enterprise
            </div>

        </div>


        <!-- VILLE VALIDÉE -->

        <div class="city">

            <img
                src="/static/images/ville2.png"
                alt=""
            >

        </div>

    </main>


    <!-- ==========================================
         FOOTER
    =========================================== -->

    <footer class="launcher-footer">

        <div class="powered">
            Powered by
        </div>

        <div class="company">
            Phoenix Security Technologies
        </div>

        <div class="copyright">
            © 2026 All rights reserved
        </div>

    </footer>

</div>

<script src="/static/js/enterprise/launcher.js"></script>

</body>
</html>
