<div class="camera-card">

    <div class="camera-header">

        <div class="camera-name">

            {{camera_name}}

        </div>

        <div class="camera-status online">

            ● ONLINE

        </div>

    </div>

    <div class="camera-stream">

        {{camera_stream}}

    </div>

    <div class="camera-footer">

        <span>

            📍 {{camera_location}}

        </span>

        <span>

            FPS : {{fps}}

        </span>

    </div>

</div>
